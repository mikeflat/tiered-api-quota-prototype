spring:
  application:
    name: gateway
  data:
    # Redis holds the per-tenant usage counters, written asynchronously by the usage writer thread.
    # Lettuce connects lazily, so the gateway starts without a Redis server. Short timeouts keep a
    # dead Redis from holding the writer for Lettuce's 60 s default on every event.
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
  mvc:
    # Spring MVC's own errors (unreadable JSON, validation) as application/problem+json too.
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

# Tenants are loaded once at startup; the gateway does not start if the file is missing or invalid.
# The default fits running the jar from gateway/; Gradle bootRun/test and the Docker image set TENANTS_FILE.
tenants:
  file: ${TENANTS_FILE:../config/tenants.json}

# Static quota settings (FR-10, NFR-8). Invalid values stop startup.
# The same defaults are repeated in the root docker-compose.yml (gateway environment); keep both in sync.
quota:
  period-seconds: ${QUOTA_PERIOD_SECONDS:60}
  limits:
    bronze: ${QUOTA_LIMIT_BRONZE:100}
    silver: ${QUOTA_LIMIT_SILVER:1000}
    gold: ${QUOTA_LIMIT_GOLD:10000}
  near-threshold-percent: ${QUOTA_NEAR_THRESHOLD_PERCENT:80}

# Usage events waiting for the single writer thread (FR-6b). When full, new events are dropped and
# counted; request threads never wait. Invalid values stop startup. Also repeated in docker-compose.yml.
usage-recording:
  queue-capacity: ${USAGE_QUEUE_CAPACITY:10000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Liveness/readiness groups come with redis-failure-and-health; keep the response to {"status":"UP"}.
      probes:
        enabled: false
  health:
    # Health reports the gateway process only; Redis is used for counting but is not part of
    # health yet (NFR-4, comes with redis-failure-and-health).
    redis:
      enabled: false
